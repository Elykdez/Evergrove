      <main>
        <h1>Evergrove: a procedural tree generator</h1>
        <p>Evergrove is a free, open-source (MIT) web app that generates 3D trees in the browser and exports them as textured GLB or OBJ models for games, rendering and 3D printing previews. It needs JavaScript and a browser with WebGPU.</p>
        <ul>
          <li>Grows trees into a crown shape you control, by space colonisation or an inverted tree-support sweep</li>
          <li>Deterministic: the same seed and settings always give the same tree</li>
          <li>Eight presets: oak, maple, conifer, acacia, poplar, willow, apple and shrub</li>
          <li>A 1k to 10k triangle budget that lowers detail just enough to fit</li>
          <li>Batch generation of up to 500 variants as one ZIP, and a grove of up to 16 placed trees</li>
        </ul>
        <p>Source code and documentation: <a href="https://github.com/Elykdez/Evergrove">github.com/Elykdez/Evergrove</a>. User guide: <a href="https://github.com/Elykdez/Evergrove/blob/main/docs/help.en.md">English</a>, <a href="https://github.com/Elykdez/Evergrove/blob/main/docs/help.zh-CN.md">Simplified Chinese</a>.</p>
